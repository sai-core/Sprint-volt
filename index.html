<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sprint Volt</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<div class="glow glow--a"></div>
<div class="glow glow--b"></div>

<!-- Mobile Sidebar Overlay -->
<div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>

<div class="layout">
  <!-- ========== SIDEBAR ========== -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-brand">
      <span class="bolt">⚡</span>
      <span>SPRINT<span class="brand-accent">VOLT</span></span>
    </div>

    <div class="sidebar-section">Browse</div>
    <div class="genre-item active" data-category="all" onclick="setCategory('all', this)">
      <span>🔥 All Movies</span>
      <span class="genre-count" id="allCount">0</span>
    </div>

    <div class="sidebar-section">Genres</div>
    <div id="sidebarGenres"></div>
  </aside>

  <!-- ========== MAIN CONTENT ========== -->
  <main class="main-content">
    <!-- Top Bar -->
    <header class="topbar">
      <button class="menu-toggle" onclick="toggleSidebar()">
        <span>☰</span> Menu
      </button>

      <div class="brand">
        <span class="bolt">⚡</span>
        <span class="brand-name">SPRINT<span class="brand-accent">VOLT</span></span>
      </div>

      <div class="search">
        <svg class="search-icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="7"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <input id="search" type="text" placeholder="Search the catalog…" autocomplete="off">
      </div>
    </header>

    <!-- Category Filters -->
    <nav class="filters" id="filters">
      <button class="chip is-active" data-category="all">All</button>
    </nav>

    <!-- Status / Empty State -->
    <div id="status" class="status"></div>

    <!-- Movies Grid -->
    <div id="movies" class="grid"></div>
  </main>
</div>

<script src="app.js"></script>
</body>
</html>
