<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sprint Volt — Admin</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root{
  --void:#0a0a12;
  --glass: rgba(255,255,255,0.055);
  --glass-hi: rgba(255,255,255,0.09);
  --glass-border: rgba(255,255,255,0.12);
  --volt:#d4ff3f;
  --violet:#7c5cff;
  --text:#f3f3f6;
  --text-dim:#9b9aa6;
  --font-display:'Space Grotesk', sans-serif;
  --font-body:'Inter', sans-serif;
  --ease: cubic-bezier(.22,1,.36,1);
}

*{ box-sizing:border-box; }

body{
  margin:0;
  min-height:100vh;
  background: var(--void);
  background-image:
    radial-gradient(circle at 15% 0%, rgba(124,92,255,0.18), transparent 45%),
    radial-gradient(circle at 90% 10%, rgba(212,255,63,0.08), transparent 40%);
  color: var(--text);
  font-family: var(--font-body);
  display:flex;
  align-items:flex-start;
  justify-content:center;
  padding: 60px 20px;
}

.panel{
  width:100%;
  max-width:480px;
  background: var(--glass);
  border:1px solid var(--glass-border);
  border-radius:18px;
  backdrop-filter: blur(18px) saturate(140%);
  -webkit-backdrop-filter: blur(18px) saturate(140%);
  padding:32px;
}

h1{
  font-family: var(--font-display);
  font-size:20px;
  margin:0 0 4px;
  display:flex;
  align-items:center;
  gap:8px;
}

h1 .accent{ color: var(--volt); }

.subtitle{
  margin:0 0 28px;
  font-size:13px;
  color: var(--text-dim);
}

label{
  display:block;
  font-size:12px;
  font-weight:600;
  letter-spacing:0.3px;
  text-transform:uppercase;
  color: var(--text-dim);
  margin:18px 0 6px;
}

label:first-of-type{ margin-top:0; }

input, textarea{
  width:100%;
  padding:11px 14px;
  border-radius:10px;
  border:1px solid var(--glass-border);
  background: rgba(255,255,255,0.03);
  color: var(--text);
  font-family: var(--font-body);
  font-size:14px;
  outline:none;
  transition: border-color .2s var(--ease), background .2s var(--ease), box-shadow .2s var(--ease);
}

input::placeholder, textarea::placeholder{ color:#5e5d68; }

input:focus, textarea:focus{
  border-color: rgba(212,255,63,0.45);
  background: var(--glass-hi);
  box-shadow: 0 0 0 4px rgba(212,255,63,0.08);
}

textarea{ min-height:90px; resize:vertical; }

button{
  width:100%;
  margin-top:24px;
  padding:13px;
  border:none;
  border-radius:10px;
  background: var(--volt);
  color: var(--void);
  font-family: var(--font-body);
  font-weight:600;
  font-size:14px;
  cursor:pointer;
  transition: transform .15s var(--ease), box-shadow .25s var(--ease), opacity .2s var(--ease);
}

button:hover{ box-shadow: 0 0 22px rgba(212,255,63,0.3); }
button:active{ transform: scale(.98); }
button:disabled{ opacity:.5; cursor:not-allowed; box-shadow:none; }

.toast{
  margin-top:16px;
  padding:11px 14px;
  border-radius:10px;
  font-size:13px;
  display:none;
}

.toast.show{ display:block; }
.toast.success{ background: rgba(212,255,63,0.1); border:1px solid rgba(212,255,63,0.3); color: var(--volt); }
.toast.error{ background: rgba(255,90,90,0.1); border:1px solid rgba(255,90,90,0.3); color:#ff8b8b; }
</style>
</head>
<body>

<div class="panel">
  <h1>⚡ SPRINT <span class="accent">VOLT</span></h1>
  <p class="subtitle">Admin — add a new title to the catalog</p>

  <label for="title">Movie title</label>
  <input type="text" id="title" placeholder="e.g. Midnight Run">

  <label for="thumbnail">Thumbnail URL</label>
  <input type="text" id="thumbnail" placeholder="https://…">

  <label for="video">Video link</label>
  <input type="text" id="video" placeholder="https://…">

  <label for="category">Category</label>
  <input type="text" id="category" placeholder="e.g. Action">

  <label for="description">Description</label>
  <textarea id="description" placeholder="Short synopsis…"></textarea>

  <button id="submitBtn" onclick="addMovie()">Add Movie</button>

  <div id="toast" class="toast"></div>
</div>

<script>
const SUPABASE_URL = "https://kvosgbxpqnuimaievngy.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imt2b3NnYnhwcW51aW1haWV2bmd5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE5NDAxMDUsImV4cCI6MjA5NzUxNjEwNX0.4xyHmpouSbWvZSD5z0mDhvf175S_dubHTBbMvojJRqE";

const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const submitBtn = document.getElementById("submitBtn");
const toast = document.getElementById("toast");

async function addMovie(){
  const title       = document.getElementById("title").value.trim();
  const thumbnail   = document.getElementById("thumbnail").value.trim();
  const video       = document.getElementById("video").value.trim();
  const category    = document.getElementById("category").value.trim();
  const description = document.getElementById("description").value.trim();

  if (!title || !video){
    showToast("Title and video link are required", "error");
    return;
  }

  submitBtn.disabled = true;
  submitBtn.textContent = "Adding…";

  const { error } = await supabaseClient
    .from("videos")
    .insert([{ title, thumbnail, video_link: video, category, description }]);

  submitBtn.disabled = false;
  submitBtn.textContent = "Add Movie";

  if (error){
    showToast(error.message, "error");
    return;
  }

  showToast("Movie added successfully", "success");
  ["title","thumbnail","video","category","description"].forEach(id => {
    document.getElementById(id).value = "";
  });
}

function showToast(message, type){
  toast.textContent = message;
  toast.className = `toast show ${type}`;
  setTimeout(() => toast.classList.remove("show"), 3500);
}
</script>
</body>
</html>
