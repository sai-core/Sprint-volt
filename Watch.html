<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sprint Volt — Now Playing</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style.css">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<div class="glow glow--a"></div>
<div class="glow glow--b"></div>

<header class="topbar">
  <button class="back-btn" id="backBtn">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5"></path><path d="M12 19l-7-7 7-7"></path></svg>
    Back
  </button>
  <div class="brand">
    <span class="bolt">⚡</span>
    <span class="brand-name">SPRINT<span class="brand-accent">VOLT</span></span>
  </div>
  <span></span>
</header>

<main class="watch-main">
  <div id="status" class="status"></div>

  <div id="playerFrame" class="player-frame"></div>

  <div id="watchInfo" class="watch-info"></div>

  <section class="related-section">
    <h2 id="relatedHeading" class="related-heading"></h2>
    <div id="relatedGrid" class="grid grid--related"></div>
  </section>
</main>

<script src="watch.js"></script>
</body>
</html>
